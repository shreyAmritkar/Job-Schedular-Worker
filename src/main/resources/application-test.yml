# Datasource and Redis coordinates are NOT hardcoded here.
# AbstractIntegrationTest injects them at runtime via @DynamicPropertySource,
# because Testcontainers assigns random host ports per run.
spring:
  jpa:
    hibernate:
      ddl-auto: validate

scheduler:
  leader-election:
    lease-ttl: 3s
    renewal-interval: 1s
    retry-interval: 1s
    retry-jitter: 500ms
  queue:
    # backpressure-threshold intentionally NOT overridden here — it stays at
    # the application.yml default (10,000) so bulk-load concurrency tests
    # (100/1000+1 jobs) don't spuriously hit backpressure. The dedicated
    # backpressure test overrides this threshold locally via
    # @TestPropertySource instead of shrinking it globally.
    aging-interval: 200ms
    aging-threshold: 300ms
    aging-boost: 1000000000
  worker-pool:
    size: 4
    poll-backoff: 100ms
  execution:
    visibility-timeout: 2s
    # Intentionally NOT fast: tests call jobRecoveryService.runRecoveryPass()
    # directly for determinism, rather than racing a background timer. A
    # long interval here just keeps the real scheduled loop out of the way.
    recovery-interval: 1h
    idempotency-key-ttl: 1h
    initial-backoff-millis: 100
    max-backoff: 2s

server:
  port: 0
