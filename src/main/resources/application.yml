spring:
  application:
    name: distributed-job-scheduler

  # Flyway owns schema creation/evolution. Hibernate must never auto-generate DDL.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health, metrics
  endpoint:
    health:
      show-details: never

scheduler:
  leader-election:
    lease-ttl: 30s
    renewal-interval: 10s
    retry-interval: 5s
    retry-jitter: 2s
  queue:
    backpressure-threshold: 10000
    aging-interval: 60s
    aging-threshold: 5m
    aging-boost: 1000000000
  worker-pool:
    size: 4
    poll-backoff: 500ms
  execution:
    visibility-timeout: 30s
    recovery-interval: 10s
    idempotency-key-ttl: 24h
    initial-backoff-millis: 1000
    max-backoff: 5m

logging:
  level:
    root: INFO
